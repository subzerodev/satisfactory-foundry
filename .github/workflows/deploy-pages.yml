name: Deploy to GitHub Pages

# Vite's documented Pages idiom: build from source on the mirror and publish
# via the Pages Actions pipeline. Triggered by the approved mirror push to main
# (the push-on-approval policy) or manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs id-token (OIDC) + pages:write; contents:read to check
# out. No write to contents — the mirror carries only source, no build output.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Owner guard: if Forgejo Actions ever runs this on the sudohworks origin,
    # skip instead of failing on GitHub-only Pages actions.
    if: github.repository_owner == 'subzerodev'
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.bundle.outputs.bundle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (subpath base)
        run: npm run build -- --base=/satisfactory-foundry/
      # The hashed bundle filename is unique per build — the verify step in
      # deploy uses it as the fingerprint of THIS build on the live site.
      - name: Record build fingerprint
        id: bundle
        run: |
          b=$(grep -o -m 1 'assets/index-[^"]*\.js' dist/index.html)
          [ -n "$b" ] || { echo "no bundle reference in dist/index.html — fingerprint would be empty, verify gate would fail open"; exit 1; }
          echo "bundle=$b" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.repository_owner == 'subzerodev'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://subzerodev.github.io/satisfactory-foundry/
    steps:
      # deploy-pages hard-caps its wait at 10 min (MAX_TIMEOUT clamp in its
      # source; larger `timeout` inputs are ignored with a warning) and then
      # reports failure + attempts a cancel — while the deployment often lands
      # server-side anyway (2026-08-06, #95: every "failed" deploy went live).
      # Its verdict is therefore ADVISORY ONLY; the job's real verdict comes
      # from the verify step below — observed reality, on our own clock.
      - name: Deploy to GitHub Pages (advisory verdict)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Verify the site serves this build
        env:
          BUNDLE: ${{ needs.build.outputs.bundle }}
        run: |
          [ -n "$BUNDLE" ] || { echo "empty fingerprint reached verify — refusing to fail open"; exit 1; }
          echo "expecting: $BUNDLE"
          for i in $(seq 1 100); do
            if curl -sf https://subzerodev.github.io/satisfactory-foundry/ | grep -qF "$BUNDLE"; then
              echo "LIVE after $((i*15))s"; exit 0
            fi
            echo "poll $i: not serving this build yet"; sleep 15
          done
          echo "NOT live within 25 min"; exit 1
