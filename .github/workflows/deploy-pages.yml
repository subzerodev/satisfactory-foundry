name: Deploy to GitHub Pages

# Vite's documented Pages idiom: build from source on the mirror and publish
# via the Pages Actions pipeline. Triggered by the approved mirror push to main
# (the push-on-approval policy) or manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs id-token (OIDC) + pages:write; contents:read to check
# out. No write to contents — the mirror carries only source, no build output.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Owner guard: if Forgejo Actions ever runs this on the sudohworks origin,
    # skip instead of failing on GitHub-only Pages actions.
    if: github.repository_owner == 'subzerodev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (subpath base)
        run: npm run build -- --base=/satisfactory-foundry/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.repository_owner == 'subzerodev'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages clamps its `timeout` input to a HARD 10-min MAX_TIMEOUT
      # (src/internal/deployment.js Math.min; it logs a warning and ignores
      # larger values — verified live 2026-08-06: run 31099772326 received
      # timeout: 1800000, still aborted at ~10:05). Pages deployments have sat
      # unprocessed in deployment_queued past that ceiling (#95), so
      # resilience comes from the retry job below — a fresh attempt gets a
      # fresh 10-min window. On timeout the action CANCELS its server-side
      # deployment before failing, so a retry never stacks on a live one.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-retry:
    # always() suppresses the implicit success() GitHub prepends to if-
    # conditions lacking a status-check function — without it this job is
    # SKIPPED whenever deploy fails, i.e. exactly when it must run. The
    # result check then scopes it: fires on deploy failure only (a build
    # failure cascades deploy to 'skipped', not 'failure', so no misfire).
    # The retry reuses the run's uploaded Pages artifact (same mechanism as
    # a "re-run failed jobs" of the deploy job, observed working).
    if: always() && github.repository_owner == 'subzerodev' && needs.deploy.result == 'failure'
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (retry)
        id: deployment
        uses: actions/deploy-pages@v4
